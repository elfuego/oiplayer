  <head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <!-- link href="css/oiplayer.min.css" rel="stylesheet" type="text/css" / -->

  <body class="oiplayer-example">
    <main class="main">
      <!-- div#clientcaps is needed for Java detection in MSIE -->
      <div id="clientcaps"></div>
      <h1>OIPlayer video &amp; audio player</h1>
      <h2>HTML5 audio and video player</h2>
      <div class="sonic-youth">
        <video
          id="sonic-youth"
          preload="metadata"
          controls="controls"
          width="384"
          height="288"
          poster="http://localhost/~andre/oiplayer/media/lovefields.png"
        >
          <source type="video/mp4; codecs=h264" src="http://localhost/~andre/oiplayer/media/fragment.mp4" />
          <source type="video/webm; codecs=vp8,vorbis" src="http://localhost/~andre/oiplayer/media/lovefields.webm" />
        </video>
      </div>
      <div class="testplayer">
        <div
          xmlns:dct="http://purl.org/dc/terms/"
          xmlns:cc="http://creativecommons.org/ns#"
          class="oip_media"
          about="https://www.openbeelden.nl/files/14/80/1481736.1480514.BG_21325_MPG_-FHD00Z02B3S.mp4"
        >
          <video
            preload="metadata"
            height="288"
            width="512"
            poster="https://www.openbeelden.nl/images/1483542/Weesp_%280_32%29.png"
            controls="controls"
          >
            <source
              type="video/mp4; codecs=avc1.42E01E,mp4a.40.2"
              src="https://www.openbeelden.nl/files/14/80/1481736.1480514.BG_21325_MPG_-FHD00Z02B3S.mp4"
            />
            <source type="video/webm" src="https://www.openbeelden.nl/files/14/80/1480514.BG_21325_MPG_-FHD00Z02B3S.webm" />
            <source
              type="video/ogg; codecs=theora,vorbis"
              src="https://www.openbeelden.nl/files/14/80/1481742.1480514.BG_21325_MPG_-FHD00Z02B3S.ogv"
            />
            <source
              type="application/x-mpegurl"
              src="https://www.openbeelden.nl/files/14/80/1481757.1480514.BG_21325_MPG__FHD00Z02B3S.m3u8"
            /></video
          ><span class="license"
            ><a href="https://www.openbeelden.nl/media/1480509" rel="cc:attributionURL" property="dct:title">Weesp</a>, door
            <a href="https://www.openbeelden.nl/users/beeldengeluid" rel="dct:creator" property="cc:attributionName"
              >Haghefilm / Willy Mullens - Nederlands Instituut voor Beeld en Geluid (beheerder)</a
            >, is gelicenseerd onder
            <a href="https://creativecommons.org/publicdomain/mark/1.0/" rel="license">Public Domain Mark</a>.</span
          >
        </div>
      </div>
